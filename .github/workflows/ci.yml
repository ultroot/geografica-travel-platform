name: Geografica CI

on:
  push:
    branches:
      - main

jobs:
  backend-check:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Verify FastAPI Application
        run: |
          cd backend
          python -c "from main import app; print('FastAPI app loaded successfully')"

      - name: Build Backend Docker Image
        run: |
          docker build -t geografica-backend ./backend
          
      - name: Run Backend Container
        run: |
          docker run -d --name geografica-test -p 8000:8000 geografica-backend